{% if limitations %}
<div class="card mt-3 mb-3 border-warning">
  <div class="card-header bg-warning-subtle"><a data-bs-toggle="collapse" href="#limitations" class="text-decoration-none text-body">
    <i class="bi bi-exclamation-triangle"></i> Known limitations ({{ limitations|length }}) — read before interpreting results</a></div>
  <div id="limitations" class="collapse show"><ul class="list-group list-group-flush small">
  {% for l in limitations %}
    <li class="list-group-item"><span class="badge text-bg-{{ {'danger':'danger','warning':'warning','info':'secondary'}[l.severity] }}">{{ l.severity }}</span>
      <strong>{{ l.title }}.</strong> {{ l.text }} <span class="text-secondary">({{ l.doc }})</span></li>
  {% endfor %}
  </ul></div>
</div>
{% endif %}
