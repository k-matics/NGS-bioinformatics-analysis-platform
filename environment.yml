name: ngs_platform
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.12
  # web / job queue
  - flask
  - flask-sqlalchemy
  - sqlalchemy
  - celery
  - redis-py
  - redis-server
  - gunicorn
  - psutil
  - pyyaml
  # data handling
  - pysam
  - cyvcf2
  - pandas
  - plotly
  - pytest
  # bioinformatics tools
  - samtools=1.21
  - bcftools=1.21
  - htslib=1.21
  - bwa
  - fastqc
  - multiqc
  - fastp
  - mosdepth
  - freebayes
  - rtg-tools
  - bedtools
  - pigz
